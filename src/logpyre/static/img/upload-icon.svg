<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Upload icon: arrow into tray">
  <defs>
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.55" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#f23824"/>
    </linearGradient>
    <linearGradient id="arrow" x1="32" y1="12" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.5" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#f23824"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular oscuro, mismo tratamiento que favicon.svg -->
  <circle cx="32" cy="32" r="27" fill="#111317"/>

  <!-- Marco circular -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- Flecha hacia arriba (vastago + punta) -->
  <path
    d="M32 13
       L45 27
       L37 27
       L37 41
       L27 41
       L27 27
       L19 27 Z"
    fill="url(#arrow)"/>

  <!-- Bandeja debajo de la flecha, refuerza la lectura como "upload" -->
  <path d="M18 46 H46 V51 H18 Z" fill="url(#arrow)"/>
</svg>
