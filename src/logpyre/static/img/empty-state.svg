<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Favicon de llama con marco circular">
  <defs>
    <linearGradient id="ring" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.55" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#f23824"/>
    </linearGradient>
    <linearGradient id="flame" x1="32" y1="52" x2="32" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f23824"/>
      <stop offset="0.5" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular oscuro -->
  <circle cx="32" cy="32" r="27" fill="#111317"/>

  <!-- Marco circular -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <!-- Llama principal, simplificada para conservar legibilidad a 16 px -->
  <path
    d="M33 12
       C32 18 27 21 25 26
       C23 30 24 33 26 36
       C23 35 21 32 21 29
       C17 34 16 39 18 44
       C20 50 25 53 32 54
       C39 53 45 48 46 42
       C47 37 44 32 40 28
       C41 33 39 36 36 37
       C38 31 38 26 36 21
       C35 18 34 15 33 12 Z"
    fill="url(#flame)"/>

  <!-- Corte interior para dar profundidad y reforzar la silueta -->
  <path
    d="M31 31
       C28 35 27 38 28 42
       C29 45 31 47 32 49
       C35 47 37 44 37 41
       C37 37 34 34 31 31 Z"
    fill="#111317"/>
</svg>
