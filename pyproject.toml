[tool.poetry]
name = "logpyre"
version = "0.1.0"
description = "Lightweight log ingestion and search tool built on Elasticsearch"
authors = ["dsalazarCazanhas"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "logpyre", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
flask = "^3.0"
flask-cors = "^6.0"
flask-moment = "^1.0"
flask-bootstrap = "^3.3"
flask-wtf = "^1.2"
elasticsearch = "^8.14"
pydantic-settings = "^2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.16.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
