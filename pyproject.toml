[tool.poetry]
name = "logpyre"
version = "0.1.0"
description = "Lightweight log ingestion and search tool built on Elasticsearch"
authors = ["dsalazarCazanhas"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "logpyre", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
flask = "^3.0"
flask-cors = "^6.0"
flask-moment = "^1.0"
flask-bootstrap = "^3.3"
flask-wtf = "^1.2"
elasticsearch = "^8.14"
pydantic-settings = "^2.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.16.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (ruff's own defaults, made explicit)
    "F",               # pyflakes (ruff's own default)
    "I",               # isort — not previously enabled
    "S",               # flake8-bandit — security (hardcoded secrets, insecure hashes, eval/exec, etc.)
]

[tool.ruff.lint.isort]
known-first-party = ["logpyre"]

[tool.ruff.lint.per-file-ignores]
# `assert` is the standard pytest idiom, not a stripped-under-`-O` production risk here.
"tests/**/*.py" = ["S101"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
