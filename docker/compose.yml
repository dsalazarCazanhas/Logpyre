# Logpyre — quickstart stack using the published, scanned Docker Hub image.
#
# Brings up Elasticsearch alongside the official Logpyre image. Elasticsearch
# is also exposed on the host (9200) for local debugging.
#
# To build and run from a local source checkout instead of the published
# image (e.g. while developing a Dockerfile change), use `docker build` /
# `docker run` directly — see the "Docker" section in the README.
#
# Usage (run from the repo root):
#   cp example.env .env      # once — edit credentials
#   docker compose --env-file .env -f docker/compose.yml up
#
# --env-file is required here: without it, Compose won't find the repo-root
# .env for ${ELASTIC_PASSWORD} below (its env_file: search path and its
# ${...} substitution search path are resolved differently).
#
# Elasticsearch only applies ELASTIC_PASSWORD on its first boot with a fresh
# volume — changing it in .env later has no effect on an existing one. To
# pick up a new password (or just reset), wipe the volume too:
#   docker compose -f docker/compose.yml down -v
#
# The Logpyre UI is then available at http://localhost:5000

name: Logpyre-es

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.3.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: 1GB
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u elastic:${ELASTIC_PASSWORD} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  logpyre:
    image: dsalazarcazanhas/logpyre:latest
    container_name: logpyre
    env_file:
      # ../.env is the repo-root .env (gitignored, your real credentials —
      # see Usage above and example.env for the full list of variables).
      - ../.env
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

networks:
  elastic:
    driver: bridge

volumes:
  esdata:
    driver: local
