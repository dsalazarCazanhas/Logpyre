# Logpyre — local integration-test stack, NOT a production deployment.
#
# Brings up Elasticsearch and builds the Logpyre web app together so the
# real Dockerfile can be exercised end to end. Elasticsearch is also exposed
# on the host (9200) for local debugging.
#
# Usage:
#   cp docker/docker.env docker/.env      # once — edit credentials
#   docker compose -f docker/compose.yml up --build
#
# The Logpyre UI is then available at http://localhost:5000

name: Logpyre-es

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:9.3.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    mem_limit: 1GB
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u elastic:${ELASTIC_PASSWORD:-changeme} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  logpyre:
    build:
      context: ../
      dockerfile: Dockerfile
    container_name: logpyre
    env_file:
      # .env is the gitignored file with your real credentials (see Usage
      # above). docker.env is only the committed placeholder template — it
      # must never be the default here, or `docker compose up` silently
      # starts with "changeme" instead of whatever you put in docker/.env.
      - ${LOGPYRE_ENV_FILE:-.env}
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elastic
    restart: unless-stopped

networks:
  elastic:
    driver: bridge

volumes:
  esdata:
    driver: local
